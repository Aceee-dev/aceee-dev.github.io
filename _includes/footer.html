<footer class="site-footer">
      <div class="container">
        <div class="row">
          <div class="col-xs-12 col-sm-6 col-md-2 col-md-offset-1">
            <p class="text-muted text-left"><a href="{{ site.url }}">&copy; {{ site.time | date: '%Y' }} {{ site.admin_name }}</a></p>
            {% if site.github_username != '' %}
            <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" title="GitHub"><i class="fa fa-github"></i></a>
            {% endif %}
            {% if site.linkedin_username != '' %}
            <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener" title="LinkedIn"><i class="fa fa-linkedin"></i></a>
            {% endif %}
          </div>
        </div>
      </div>
    </footer>

  </div><!-- .main.container -->

    <!-- JavaScript -->
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
    <script src="{{ site.url }}/js/wow.min.js"></script>
    <script src="{{ site.url }}/js/app.js"></script>


    </body>
</html>
